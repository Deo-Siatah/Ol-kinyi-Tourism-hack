<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3D2E" />
    <title>Ol-Kinyi</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/img/icon-192.png" />
    <link rel="preload" href="/vendor/fonts/fraunces-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/vendor/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.min.js",
          "three/addons/": "/vendor/addons/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/vendor/fonts/fraunces-latin-600-normal.woff2") format("woff2");
      }

      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/vendor/fonts/fraunces-latin-700-normal.woff2") format("woff2");
      }

      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/vendor/fonts/inter-latin-400-normal.woff2") format("woff2");
      }

      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/vendor/fonts/inter-latin-600-normal.woff2") format("woff2");
      }

      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/vendor/fonts/inter-latin-700-normal.woff2") format("woff2");
      }

      :root {
        --deep: #0b3d2e;
        --mid: #1e7a46;
        --bright: #7cc08f;
        --sun: #f3b95f;
        --clay: #c25b3f;
        --sky: #2f7ea6;
        --sand: #f8f2e7;
        --ink: #10241c;
        --muted: #43695a;
        --line: #e2eee5;
        --panel: #f6faf7;
        --white: #ffffff;
        --font-display: "Fraunces", Georgia, "Times New Roman", serif;
        --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--font-body);
        background: var(--white);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
      }

      .screens {
        position: relative;
        flex: 1;
        overflow: hidden;
      }

      .screen {
        height: 100%;
        overflow-y: auto;
        padding: calc(16px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      }

      .screen--explore {
        padding: 0;
        overflow: hidden;
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mid);
      }

      .hero-title {
        margin: 0 0 10px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 34px;
        line-height: 1.08;
        letter-spacing: -0.01em;
        color: var(--deep);
      }

      .lede {
        margin: 0 0 18px;
        font-size: 17px;
        line-height: 1.45;
        color: var(--mid);
      }

      .panel {
        margin: 0 0 16px;
        padding: 16px;
        background: var(--panel);
        border-radius: 20px;
        box-shadow: 0 4px 16px rgba(11, 61, 46, 0.08);
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mid);
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .greetings li {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 8px;
        padding: 12px 14px;
        background: var(--white);
        border-radius: 14px;
      }

      .greetings strong {
        font-size: 20px;
        color: var(--deep);
      }

      .greetings span {
        font-size: 15px;
        color: var(--mid);
      }

      .etiquette li {
        position: relative;
        margin: 8px 0;
        padding-left: 22px;
        font-size: 15px;
        line-height: 1.4;
        color: var(--muted);
      }

      .etiquette li::before {
        content: "";
        position: absolute;
        top: 8px;
        left: 4px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--bright);
      }

      .screen--before {
        padding: 0 0 calc(24px + env(safe-area-inset-bottom));
      }

      .landing-hero {
        position: relative;
        display: flex;
        align-items: flex-end;
        min-height: min(76vh, 600px);
        overflow: hidden;
        border-radius: 0 0 30px 30px;
        background: var(--deep);
      }

      .landing-hero__image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .landing-hero__scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(11, 61, 46, 0.05) 0%,
          rgba(11, 61, 46, 0.36) 42%,
          rgba(11, 61, 46, 0.93) 100%
        );
      }

      .landing-hero__content {
        position: relative;
        width: 100%;
        padding: calc(64px + env(safe-area-inset-top)) 20px 28px;
        color: var(--white);
      }

      .landing-hero .eyebrow {
        color: var(--sun);
      }

      .landing-hero .hero-title {
        max-width: 12ch;
        color: var(--white);
        font-size: clamp(36px, 10vw, 52px);
        text-wrap: balance;
      }

      .landing-hero .lede {
        max-width: 34ch;
        color: #e6f1ea;
      }

      .landing-hero .btn--accent {
        margin-bottom: 10px;
      }

      .landing-body {
        padding: 22px 20px 0;
      }

      #before-you-go {
        scroll-margin-top: 16px;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .section-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 24px;
        line-height: 1.15;
        color: var(--deep);
      }

      .section-kicker {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 22px;
      }

      .preview {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 10px 24px rgba(11, 61, 46, 0.12);
      }

      .preview img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
      }

      .preview__icon {
        position: absolute;
        top: 8px;
        left: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--mid);
      }

      .preview__icon .icon {
        width: 16px;
        height: 16px;
      }

      .preview h3 {
        display: -webkit-box;
        margin: 0;
        padding: 10px 10px 12px;
        overflow: hidden;
        font-family: var(--font-display);
        font-size: 14px;
        line-height: 1.2;
        color: var(--deep);
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .values {
        display: grid;
        gap: 10px;
        margin-bottom: 22px;
      }

      .value {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
      }

      .value__icon {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 13px;
        background: var(--white);
        color: var(--clay);
        box-shadow: 0 6px 16px rgba(11, 61, 46, 0.1);
      }

      .value__icon .icon {
        width: 20px;
        height: 20px;
      }

      .value h2 {
        margin: 0 0 3px;
        font-family: var(--font-display);
        font-size: 17px;
        line-height: 1.2;
        color: var(--deep);
      }

      .value p {
        margin: 0;
        font-size: 14px;
        line-height: 1.42;
        color: var(--muted);
      }

      .credits {
        margin: 18px 0 0;
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
      }

      .credits a {
        color: var(--mid);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .panel-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .panel-title .icon {
        width: 18px;
        height: 18px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        padding: 0 24px;
        border: none;
        border-radius: 16px;
        font-family: inherit;
        font-size: 17px;
        font-weight: 800;
        cursor: pointer;
        text-decoration: none;
        transition: transform 250ms ease, box-shadow 250ms ease;
      }

      .btn:active {
        transform: translateY(1px) scale(0.99);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn--accent {
        background: var(--sun);
        color: var(--deep);
        box-shadow: 0 8px 20px rgba(243, 185, 95, 0.4);
      }

      .btn--mid {
        background: var(--mid);
        color: var(--white);
        box-shadow: 0 8px 20px rgba(30, 122, 70, 0.3);
      }

      .btn--ghost {
        min-height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.38);
        background: rgba(255, 255, 255, 0.14);
        color: var(--white);
        font-size: 15px;
        box-shadow: none;
      }

      .btn--ghost:active {
        background: rgba(255, 255, 255, 0.24);
      }

      .camera-view {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--deep);
      }

      .ar-layer {
        position: absolute;
        inset: 0;
      }

      .camera-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .scan-guide {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 24px;
        pointer-events: none;
      }

      .reticle {
        position: relative;
        width: min(60vw, 232px);
        aspect-ratio: 1 / 1;
        border: 3px solid rgba(255, 255, 255, 0.96);
        border-radius: 30px;
        box-shadow:
          0 0 0 1px rgba(11, 61, 46, 0.35),
          0 0 24px rgba(11, 61, 46, 0.35);
      }

      .reticle::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--sun);
        transform: translate(-50%, -50%);
      }

      .scan-guide__text {
        margin: 0;
        max-width: 32ch;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(11, 61, 46, 0.82);
        color: var(--white);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.3;
        text-align: center;
      }

      .scan-toggle {
        width: auto;
        min-height: 44px;
        padding: 0 20px;
        pointer-events: auto;
      }

      .screen--explore[data-scanning="false"] .reticle {
        display: none;
      }

      .camera-error {
        position: absolute;
        z-index: 4;
        top: calc(16px + env(safe-area-inset-top));
        left: 16px;
        right: 16px;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--sun);
        color: var(--deep);
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 8px 24px rgba(11, 61, 46, 0.25);
      }

      .target-dock {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        padding: 16px 12px calc(12px + env(safe-area-inset-bottom));
        background: linear-gradient(180deg, rgba(11, 61, 46, 0) 0%, rgba(11, 61, 46, 0.72) 100%);
      }

      .targets {
        display: flex;
        gap: 10px;
      }

      .target {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-height: 84px;
        padding: 10px 6px;
        border: none;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        color: var(--deep);
        font-family: inherit;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
        transition: transform 250ms ease;
      }

      .target:active {
        transform: scale(0.97);
      }

      .target img {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--bright);
      }

      .target span {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        max-height: 82%;
        overflow-y: auto;
        padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
        background: var(--white);
        border-radius: 28px 28px 0 0;
        box-shadow: 0 -12px 40px rgba(11, 61, 46, 0.28);
      }

      .sheet:not([hidden]) {
        animation: sheet-in 250ms ease;
      }

      @keyframes sheet-in {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      .sheet--reveal {
        inset: 0;
        max-height: none;
        height: 100%;
        padding: 0 20px calc(24px + env(safe-area-inset-bottom));
        border-radius: 0;
        box-shadow: none;
      }

      .sheet--reveal:not([hidden]) {
        animation: reveal-in 280ms ease;
      }

      @keyframes reveal-in {
        from {
          opacity: 0;
          transform: translateY(6%);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .sheet__image {
        display: block;
        width: calc(100% + 40px);
        height: 40vh;
        max-height: 320px;
        margin: 0 -20px 18px;
        object-fit: cover;
        border-radius: 0 0 28px 28px;
        background: var(--panel);
      }

      .sheet--reveal .sheet__close {
        top: calc(14px + env(safe-area-inset-top));
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 6px 18px rgba(11, 61, 46, 0.24);
      }

      .sheet__close {
        position: absolute;
        top: 14px;
        right: 14px;
        min-width: 48px;
        min-height: 48px;
        padding: 0 12px;
        border: none;
        border-radius: 999px;
        background: var(--panel);
        color: var(--mid);
        font-family: inherit;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }

      .sheet__head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding-right: 64px;
      }

      .sheet__head h2 {
        margin: 0;
        font-size: 26px;
        line-height: 1.1;
        color: var(--deep);
      }

      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--sun);
        color: var(--deep);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .sheet__summary {
        margin: 12px 0;
        font-size: 17px;
        line-height: 1.45;
        color: var(--mid);
      }

      .sheet__details {
        margin: 0 0 12px;
        padding-left: 20px;
        list-style: disc;
      }

      .sheet__details li {
        margin: 6px 0;
        font-size: 15px;
        line-height: 1.4;
        color: var(--ink);
      }

      .highlights {
        display: grid;
        gap: 14px;
        margin: 0 0 16px;
      }

      .highlight {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
      }

      .highlight__title {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mid);
      }

      .swatches {
        display: grid;
        gap: 8px;
      }

      .swatch {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .swatch__dot {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 1px solid rgba(11, 61, 46, 0.18);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
      }

      .swatch__text {
        display: flex;
        flex-direction: column;
        gap: 1px;
        font-size: 14px;
        line-height: 1.35;
        color: var(--muted);
      }

      .swatch__text strong {
        font-size: 14px;
        color: var(--deep);
      }

      .swatch--red {
        background: #c0392b;
      }

      .swatch--white {
        background: #ffffff;
      }

      .swatch--blue {
        background: #2f6fb0;
      }

      .swatch--green {
        background: var(--mid);
      }

      .swatch--orange-and-yellow {
        background: linear-gradient(120deg, #e07b39, #f3b95f);
      }

      .swatch--black {
        background: #1b1b1b;
      }

      .swatch--blue-and-black-plaid {
        background: linear-gradient(135deg, #2f6fb0 0 50%, #1b1b1b 50% 100%);
      }

      .swatch--geometric-squares {
        background: repeating-linear-gradient(45deg, #c25b3f 0 4px, #f3b95f 4px 8px);
      }

      .timeline {
        display: grid;
        gap: 10px;
      }

      .timeline__item {
        display: flex;
        gap: 10px;
      }

      .timeline__dot {
        flex: 0 0 auto;
        width: 10px;
        height: 10px;
        margin-top: 5px;
        border-radius: 999px;
        background: var(--sun);
        box-shadow: 0 0 0 3px rgba(243, 185, 95, 0.25);
      }

      .timeline__item strong {
        display: block;
        font-size: 14px;
        color: var(--deep);
      }

      .timeline__item p {
        margin: 2px 0 0;
        font-size: 13px;
        line-height: 1.4;
        color: var(--muted);
      }

      .sheet__folklore {
        margin: 0 0 16px;
        padding: 12px 14px;
        border-left: 4px solid var(--bright);
        border-radius: 12px;
        background: var(--panel);
        font-size: 15px;
        line-height: 1.45;
        color: var(--ink);
      }

      .ask {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .ask .btn {
        width: auto;
        flex: 0 0 auto;
        padding: 0 20px;
      }

      .ask__input {
        flex: 1;
        min-width: 0;
        min-height: 48px;
        padding: 0 14px;
        border: 2px solid var(--line);
        border-radius: 14px;
        background: var(--white);
        color: var(--ink);
        font-family: inherit;
        font-size: 16px;
      }

      .ask__input:focus {
        outline: 3px solid var(--bright);
        outline-offset: 1px;
        border-color: var(--mid);
      }

      .ask__answer {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.45;
        color: var(--mid);
      }

      .listen-status {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.45;
        color: var(--mid);
      }

      .visualize-head {
        margin-bottom: 16px;
      }

      .visualize-title {
        margin: 0 0 6px;
        font-family: var(--font-display);
        font-size: clamp(28px, 8vw, 40px);
        line-height: 1.1;
        color: var(--deep);
        overflow-wrap: anywhere;
      }

      .visualize-card {
        margin-bottom: 16px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--white);
        box-shadow: 0 10px 28px rgba(11, 61, 46, 0.12);
      }

      .cutaway {
        overflow: hidden;
        border-radius: 18px;
        background: linear-gradient(180deg, #fbf6ec 0%, #f1e6d3 100%);
      }

      .cutaway-svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .visualize-part {
        cursor: pointer;
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 300ms ease, filter 300ms ease;
      }

      .visualize-part.is-active {
        filter: drop-shadow(0 0 10px rgba(243, 185, 95, 0.95));
      }

      .cutaway.is-expanded [data-section="roof"] {
        transform: translateY(-34px);
      }

      .cutaway.is-expanded [data-section="walls"] {
        transform: translateX(-26px);
      }

      .cutaway.is-expanded [data-section="entrance"] {
        transform: translateY(26px);
      }

      .cutaway.is-expanded [data-section="interior"] {
        transform: translateX(28px);
      }

      .cutaway.is-expanded [data-section="enclosure"] {
        transform: scale(1.03);
      }

      .section-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      .section-chip {
        min-height: 48px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--deep);
        font-family: inherit;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }

      .section-chip.is-active {
        border-color: var(--sun);
        background: var(--sun);
        color: var(--deep);
        box-shadow: 0 6px 16px rgba(243, 185, 95, 0.4);
      }

      .section-panel .panel-title {
        margin: 0 0 8px;
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: none;
        color: var(--deep);
      }

      .section-text {
        margin: 0;
        font-size: 15px;
        line-height: 1.45;
        color: var(--muted);
      }

      .progress {
        margin: 4px 0 16px;
        font-size: 16px;
        font-weight: 800;
        color: var(--mid);
      }

      .cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--white);
        box-shadow: 0 6px 18px rgba(11, 61, 46, 0.1);
      }

      .card img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        object-fit: cover;
        flex: 0 0 auto;
      }

      .card h3 {
        margin: 0 0 4px;
        font-size: 18px;
        color: var(--deep);
      }

      .card p {
        margin: 0;
        font-size: 14px;
        line-height: 1.4;
        color: var(--mid);
      }

      .empty {
        margin: 0;
        padding: 28px 20px;
        border-radius: 18px;
        background: var(--panel);
        color: var(--mid);
        font-size: 16px;
        font-weight: 700;
        text-align: center;
      }

      .tabbar {
        display: flex;
        background: var(--white);
        border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom);
        box-shadow: 0 -4px 20px rgba(11, 61, 46, 0.06);
      }

      .tab {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-height: 60px;
        padding: 0;
        border: none;
        background: none;
        color: #6b8a7b;
        font-family: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: color 250ms ease;
      }

      .tab__icon {
        width: 20px;
        height: 20px;
      }

      .tab__label {
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .tab[aria-selected="true"] {
        color: var(--mid);
      }

      .tab[aria-selected="true"] .tab__icon {
        color: var(--sun);
      }

      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        bottom: 8px;
        left: 50%;
        width: 28px;
        height: 4px;
        border-radius: 999px;
        background: var(--sun);
        transform: translateX(-50%);
      }

      .tab--scan {
        overflow: visible;
      }

      .tab--scan .tab__scan-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        margin-top: -18px;
        border-radius: 999px;
        background: var(--sun);
        color: var(--deep);
        box-shadow:
          0 6px 16px rgba(243, 185, 95, 0.55),
          0 0 0 4px var(--white);
      }

      .tab--scan .tab__scan-badge .tab__icon {
        width: 24px;
        height: 24px;
        color: var(--deep);
      }

      .tab--scan .tab__label {
        font-size: 12px;
        font-weight: 800;
        color: var(--deep);
      }

      .tab--scan[aria-selected="true"] .tab__scan-badge {
        box-shadow:
          0 8px 20px rgba(243, 185, 95, 0.7),
          0 0 0 4px var(--white),
          0 0 0 6px var(--sun);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
